<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Matchstatistik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1512;
    --bg-grad-top:#16241A;
    --bg-elev:#161F1A;
    --bg-elev-2:#1D2820;
    --line:#2A3A31;
    --turf:#3FA34D;
    --turf-deep:#2C7A3A;
    --turf-glow: rgba(63,163,77,0.25);
    --chalk:#F4F6F2;
    --dim:#93A79A;
    --gold:#E8B94B;
    --red:#D8544A;
    --opp:#7C8BA8;
    --opp-deep:#5A6785;
    --toast-bg:#F4F6F2;
    --toast-text:#0E1512;
    --spinner-track: rgba(244,246,242,0.25);
    --radius-card:20px;
    --radius-btn:12px;
    --radius-chip:999px;
  }
  :root[data-theme="light"]{
    --bg:#F3F6F0;
    --bg-grad-top:#FFFFFF;
    --bg-elev:#FFFFFF;
    --bg-elev-2:#EEF3EA;
    --line:#DBE4D7;
    --turf:#2C9A44;
    --turf-deep:#1F7A34;
    --turf-glow: rgba(44,154,68,0.16);
    --chalk:#152018;
    --dim:#5C6C61;
    --gold:#B8790E;
    --red:#C0392B;
    --opp:#46536B;
    --opp-deep:#333E52;
    --toast-bg:#152018;
    --toast-text:#F4F6F2;
    --spinner-track: rgba(21,32,24,0.15);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse 120% 80% at 50% -10%, var(--bg-grad-top) 0%, var(--bg) 55%);
    color:var(--chalk);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    transition: background .2s ease, color .2s ease;
  }
  .theme-btn{background:var(--bg-elev-2); border:1px solid var(--line); color:var(--chalk); width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; flex-shrink:0;}
  .theme-btn:active{transform:scale(0.92);}
  .topbar-right{display:flex; align-items:center; gap:8px;}
  .score-num, .clock, .app-title{font-family:'Oswald',system-ui,sans-serif;}
  #app{max-width:900px;margin:0 auto;padding:16px 16px 40px;}
  button{font-family:inherit;}
  .btn{
    appearance:none; border:none; cursor:pointer;
    background:var(--bg-elev-2); color:var(--chalk);
    border:1px solid var(--line);
    border-radius:var(--radius-btn);
    padding:14px 16px;
    font-size:15px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .08s ease, background .15s ease;
    min-height:48px;
  }
  .btn:active{transform:scale(0.96);}
  .btn:disabled{opacity:0.45; cursor:not-allowed; transform:none;}
  .btn-primary{background:linear-gradient(180deg, var(--turf) 0%, var(--turf-deep) 100%); border-color:transparent; color:#08150B; font-weight:700;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--dim);}
  .btn-danger{background:transparent; border:1px solid var(--red); color:var(--red);}
  .btn-danger-solid{background:var(--red); border:1px solid var(--red); color:#fff; font-weight:700;}
  .btn-danger-solid:active{transform:scale(0.96);}
  .btn-block{width:100%;}
  .btn-lg{padding:20px; font-size:17px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px;}
  .back-link{background:none; border:none; color:var(--dim); font-size:15px; font-weight:600; cursor:pointer; padding:8px 4px; display:flex; align-items:center; gap:6px;}
  .app-title{font-size:22px; font-weight:600; letter-spacing:0.3px; margin:0;}

  .card{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius-card); padding:18px; margin-bottom:14px;}
  .card-tap{cursor:pointer;}
  .card-tap:active{transform:scale(0.985);}
  .section-label{color:var(--dim); font-size:13px; font-weight:600; margin:0 0 10px 2px;}

  .home-menu{display:flex; flex-direction:column; gap:12px; margin-top:8px;}
  .home-item{display:flex; align-items:center; gap:14px; padding:20px; background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius-card); cursor:pointer;}
  .home-item:active{transform:scale(0.985);}
  .home-item .ico{font-size:26px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:var(--bg-elev-2); border-radius:12px; flex-shrink:0;}
  .home-item .txt strong{display:block; font-size:16px;}
  .home-item .txt span{color:var(--dim); font-size:13px;}

  input[type=text], input[type=number], input[type=url]{
    background:var(--bg-elev-2); border:1px solid var(--line); color:var(--chalk);
    border-radius:var(--radius-btn); padding:13px 14px; font-size:15px; width:100%;
    font-family:inherit;
  }
  input:focus{outline:2px solid var(--turf); outline-offset:1px;}
  label.field-label{display:block; color:var(--dim); font-size:13px; font-weight:600; margin:0 0 6px 2px;}
  .field{margin-bottom:16px;}
  .row-2{display:grid; grid-template-columns:88px 1fr; gap:10px;}
  .row-2-even{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* Roster */
  .player-row{display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line);}
  .player-row:last-child{border-bottom:none;}
  .num-badge{width:38px; height:38px; border-radius:50%; background:var(--bg-elev-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
  .player-row .pname{flex:1; font-size:15px;}
  .icon-btn{background:none; border:none; color:var(--dim); font-size:18px; cursor:pointer; padding:6px;}
  .icon-btn.danger{color:var(--red);}
  .edit-row{display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid var(--line);}
  .edit-row:last-child{border-bottom:none;}
  .edit-row input[type=number]{width:66px; flex-shrink:0;}
  .edit-row input[type=text]{flex:1;}

  /* Setup */
  .logo-preview{width:64px; height:64px; border-radius:14px; background:var(--bg-elev-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;}
  .logo-preview img{width:100%; height:100%; object-fit:contain;}
  .logo-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .spinner{width:18px; height:18px; border:2.5px solid var(--spinner-track); border-top-color:var(--chalk); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .checkline{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line);}
  .checkline:last-child{border-bottom:none;}
  .checkline input{width:20px; height:20px; accent-color:var(--turf);}

  /* Scoreboard */
  .scoreboard{
    background:radial-gradient(ellipse at 50% 0%, var(--turf-glow), transparent 70%), var(--bg-elev);
    border:1px solid var(--line); border-radius:var(--radius-card);
    padding:18px; margin-bottom:16px;
  }
  .clockrow{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:12px;}
  .clock{font-size:15px; color:var(--dim); letter-spacing:1px; font-weight:600;}
  .clock.clock-over{color:var(--gold);}
  .period-row{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .period-pill{background:var(--bg-elev-2); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:600; color:var(--dim);}
  .period-pill strong{color:var(--chalk);}
  .preset-row{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .preset-btn{background:var(--bg-elev-2); border:1px solid var(--line); color:var(--dim); border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:600; cursor:pointer;}
  .preset-btn.active{border-color:var(--turf); color:var(--turf);}
  .clock-btn{background:var(--bg-elev-2); border:1px solid var(--line); color:var(--chalk); width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px;}
  .teams-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .team-side{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0;}
  .team-badge{width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; overflow:hidden; flex-shrink:0;}
  .team-badge.us{background:linear-gradient(180deg, var(--turf), var(--turf-deep)); color:#08150B;}
  .team-badge.opp{background:var(--bg-elev-2); border:1px solid var(--line);}
  .team-badge img{width:100%; height:100%; object-fit:contain;}
  .team-name{font-size:12.5px; color:var(--dim); font-weight:600; text-align:center; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .score-num{font-size:44px; font-weight:600; line-height:1;}
  .score-mid{display:flex; align-items:center; gap:10px; padding:0 6px;}
  .score-colon{font-size:30px; color:var(--dim); font-weight:600;}

  /* Event grid */
  .team-columns{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;}
  @media (max-width:480px){ .team-columns{gap:10px;} }
  .team-col-head{font-size:13px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
  .team-col-head.us{color:var(--turf);}
  .team-col-head.opp{color:var(--opp);}
  .evt-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .evt-btn{padding:16px 6px; font-size:13.5px; flex-direction:column; gap:4px; min-height:64px; text-align:center;}
  .evt-btn .e-ico{font-size:20px;}
  .evt-btn.wide{grid-column:1 / -1;}

  /* Event log */
  .event-item{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
  .event-item:active{background:var(--bg-elev-2);}
  .event-item:last-child{border-bottom:none;}
  .event-item .e-time{color:var(--dim); font-size:12px; width:58px; flex-shrink:0; font-variant-numeric:tabular-nums;}
  .event-item .e-ico2{font-size:17px; width:22px; flex-shrink:0; text-align:center;}
  .event-item .e-desc{flex:1; font-size:14px;}
  .event-item .e-desc .who{color:var(--dim); font-size:12.5px; display:block;}
  .empty-hint{color:var(--dim); font-size:14px; text-align:center; padding:30px 10px;}

  /* Modal */
  .modal-backdrop{position:fixed; inset:0; background:rgba(6,10,8,0.72); backdrop-filter:blur(2px); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .modal-sheet{background:var(--bg-elev); border-radius:22px 22px 0 0; width:100%; max-width:900px; padding:18px 18px calc(20px + env(safe-area-inset-bottom)); max-height:85vh; overflow-y:auto; border-top:1px solid var(--line);}
  .modal-title{font-size:17px; font-weight:700; margin:0 0 4px;}
  .modal-sub{color:var(--dim); font-size:13px; margin:0 0 16px;}
  .modal-close{position:absolute; top:14px; right:16px; background:var(--bg-elev-2); border:none; color:var(--dim); width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer;}
  .modal-sheet{position:relative;}
  .num-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media (min-width:520px){ .num-grid{grid-template-columns:repeat(5,1fr);} }
  .num-chip{aspect-ratio:1; border-radius:16px; background:var(--bg-elev-2); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; padding:4px;}
  .num-chip:active{transform:scale(0.94); background:var(--turf-deep);}
  .num-chip.selected{background:var(--turf-deep); border-color:var(--turf);}
  .num-chip.selected .n, .num-chip.selected .nm{color:#EFFBF1;}
  .num-chip .n{font-size:19px; font-weight:700;}
  .num-chip .nm{font-size:9.5px; color:var(--dim); text-align:center; line-height:1.15; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
  .keypad button{background:var(--bg-elev-2); border:1px solid var(--line); color:var(--chalk); font-size:22px; font-weight:600; border-radius:14px; padding:18px 0; cursor:pointer;}
  .keypad button:active{transform:scale(0.94);}
  .keypad-display{text-align:center; font-size:38px; font-weight:700; font-family:'Oswald',sans-serif; margin-bottom:14px; min-height:46px; color:var(--gold);}
  .sub-cols{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  .sub-col-title{font-size:12.5px; color:var(--dim); font-weight:700; margin-bottom:8px;}
  .sub-list{display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;}
  .sub-pick{display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg-elev-2); cursor:pointer; font-size:13.5px;}
  .sub-pick.selected{border-color:var(--turf); background:rgba(63,163,77,0.18);}

  .pitch-wrap{position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line);}
  .pitch-marker{position:absolute; width:18px; height:18px; border-radius:50%; border:2.5px solid #fff; transform:translate(-50%,-50%); box-shadow:0 0 0 3px rgba(0,0,0,0.3), 0 2px 6px rgba(0,0,0,0.4); pointer-events:none;}

  textarea{background:var(--bg-elev-2); border:1px solid var(--line); color:var(--chalk); border-radius:var(--radius-btn); padding:13px 14px; font-size:15px; width:100%; font-family:inherit; resize:vertical;}
  textarea:focus{outline:2px solid var(--turf); outline-offset:1px;}
  .report-text{font-size:14.5px; line-height:1.6; white-space:pre-wrap;}
  .report-meta{color:var(--dim); font-size:12px; margin-top:10px;}

  .toast{position:fixed; bottom:calc(24px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--toast-bg); color:var(--toast-text); padding:12px 20px; border-radius:999px; font-weight:600; font-size:14px; z-index:80; box-shadow:0 8px 24px rgba(0,0,0,0.35); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .hist-card{display:flex; align-items:center; gap:14px;}
  .hist-badge{width:40px; height:40px; border-radius:10px; background:var(--bg-elev-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; font-size:15px; font-weight:700;}
  .hist-badge img{width:100%; height:100%; object-fit:contain;}
  .hist-info{flex:1; min-width:0;}
  .hist-info .opp{font-size:15px; font-weight:600;}
  .hist-info .date{color:var(--dim); font-size:12.5px;}
  .hist-score{font-family:'Oswald',sans-serif; font-size:20px; font-weight:600; flex-shrink:0;}
  .chev{color:var(--dim); font-size:18px; flex-shrink:0;}

  .stat-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .stat-table th{text-align:center; color:var(--dim); font-size:11px; font-weight:700; padding:6px 4px; border-bottom:1px solid var(--line);}
  .stat-table th:first-child, .stat-table td:first-child{text-align:left;}
  .stat-table td{text-align:center; padding:8px 4px; border-bottom:1px solid var(--line);}
  .stat-table tr:last-child td{border-bottom:none;}
  .stat-table td.name{display:flex; align-items:center; gap:8px; text-align:left;}

  .fab-note{color:var(--dim); font-size:12.5px; text-align:center; margin-top:10px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ---------- Storage helpers ----------
   window.storage only exists when this app runs as a Claude.ai artifact.
   When opened as a standalone file or hosted elsewhere, fall back to localStorage
   so rosters and matches still persist. */
function hasClaudeStorage(){ return typeof window.storage !== 'undefined' && window.storage !== null; }
async function storeGet(key, fallback){
  if(hasClaudeStorage()){
    try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : fallback; }
    catch(e){ return fallback; }
  }
  try{ const raw = localStorage.getItem('matchstat_'+key); return raw!==null ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
async function storeSet(key, value){
  if(hasClaudeStorage()){
    try{ const result = await window.storage.set(key, JSON.stringify(value), false); if(!result) console.error('storage set failed'); }
    catch(e){ console.error('storage set failed', e); }
    return;
  }
  try{ localStorage.setItem('matchstat_'+key, JSON.stringify(value)); }
  catch(e){ console.error('localStorage set failed', e); }
}
async function storeDelete(key){
  if(hasClaudeStorage()){
    try{ await window.storage.delete(key, false); }catch(e){}
    return;
  }
  try{ localStorage.removeItem('matchstat_'+key); }catch(e){}
}

/* ---------- App State ---------- */
let roster = [];        // [{id, number, name}]
let teamName = 'Mitt lag';
let matchIndex = [];    // [{id,date,opponentName,opponentLogo,scoreUs,scoreOpp,finished}]
let current = null;     // full live/open match object
let screen = 'home';
let setup = { opponentName:'', opponentLogo:'', lineup:new Set(), searching:false, logoError:false };
let modal = null;
let timer = { elapsed:0, running:false, intervalId:null };
let viewMatch = null; // for history detail
let theme = 'dark';
let editingPlayerId = null;
let reportGenerating = false;
let statMapFilters = { goal:true, freekick:true, offside:true, card:true };
let apiKey = '';

const EVENT_META = {
  goal:{icon:'⚽', label:'Mål'},
  assist:{icon:'🎯', label:'Assist'},
  corner:{icon:'🚩', label:'Hörna'},
  freekick:{icon:'🦶', label:'Frispark'},
  penalty:{icon:'⚪', label:'Straff'},
  yellow:{icon:'🟨', label:'Gult kort'},
  red:{icon:'🟥', label:'Rött kort'},
  offside:{icon:'🚫', label:'Offside'},
  sub:{icon:'🔄', label:'Byte'}
};
const LOCATION_TYPES = ['goal','freekick','yellow','red','offside'];
/* Penalty box zones in the 0-100% coordinate system used for locations (SVG viewBox is 0 0 300 200) */
const LEFT_BOX = { xMin:8/300*100, xMax:50/300*100, yMin:52/200*100, yMax:148/200*100 };
const RIGHT_BOX = { xMin:250/300*100, xMax:292/300*100, yMin:52/200*100, yMax:148/200*100 };
const PENALTY_MARGIN = 4; // % distance from the box line counted as "too close to call"
function inBoxStatus(loc, box, margin){
  const insideX = loc.x>=box.xMin && loc.x<=box.xMax;
  const insideY = loc.y>=box.yMin && loc.y<=box.yMax;
  if(insideX && insideY){
    const distToEdge = Math.min(loc.x-box.xMin, box.xMax-loc.x, loc.y-box.yMin, box.yMax-loc.y);
    return distToEdge<=margin ? 'near' : 'inside';
  }
  const dx = loc.x<box.xMin ? box.xMin-loc.x : (loc.x>box.xMax ? loc.x-box.xMax : 0);
  const dy = loc.y<box.yMin ? box.yMin-loc.y : (loc.y>box.yMax ? loc.y-box.yMax : 0);
  const dist = Math.sqrt(dx*dx+dy*dy);
  return dist<=margin ? 'near' : 'outside';
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtClock(sec){ const m = Math.floor(sec/60).toString().padStart(2,'0'); const s = (sec%60).toString().padStart(2,'0'); return m+':'+s; }
function fmtDate(iso){ const d = new Date(iso); return d.toLocaleDateString('sv-SE', {day:'numeric', month:'short', year:'numeric'}); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ---------- Init ---------- */
async function init(){
  roster = await storeGet('roster', []);
  teamName = await storeGet('team-name', 'Mitt lag');
  matchIndex = await storeGet('match-index', []);
  theme = await storeGet('theme', 'dark');
  apiKey = await storeGet('anthropic-api-key', '');
  document.documentElement.setAttribute('data-theme', theme);
  render();
}
async function updateApiKey(val){
  apiKey = val.trim();
  await storeSet('anthropic-api-key', apiKey);
}

async function toggleTheme(){
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  await storeSet('theme', theme);
  render();
}

/* ---------- Navigation ---------- */
function goHome(){ screen='home'; modal=null; render(); }
function goRoster(){ screen='roster'; render(); }
function goHistory(){ screen='history'; render(); }
function goSetup(){
  setup = { opponentName:'', opponentLogo:'', lineup:new Set(roster.map(p=>p.id)), searching:false, logoError:false, periods:2, periodMinutes:45 };
  screen='setup'; render();
}
function setPreset(periods, minutes){
  setup.periods = periods; setup.periodMinutes = minutes;
  render();
}

/* ---------- Roster management ---------- */
async function addPlayer(){
  const numEl = document.getElementById('new-num');
  const nameEl = document.getElementById('new-name');
  const num = numEl.value.trim();

/* ---------- Anthropic API helper ----------
   Inside Claude.ai's artifact environment, requests to api.anthropic.com are
   authenticated automatically. Standalone (downloaded file, GitHub Pages, etc.)
   there is no built-in auth, so we use the user's own key from settings if set. */
function anthropicHeaders(){
  const headers = {'Content-Type':'application/json'};
  if(apiKey){
    headers['x-api-key'] = apiKey;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  return headers;
}
function aiUnavailableMessage(){
  return hasClaudeStorage()
    ? 'Kunde inte nå Claude just nu — försök igen.'
    : 'Kunde inte nå Claude. Appen körs fristående — lägg in en Anthropic API-nyckel under Spelartrupp för att aktivera den här funktionen.';
}

async function searchLogo(){
  const nameEl = document.getElementById('opp-name');
  setup.opponentName = nameEl.value.trim();
  if(!setup.opponentName){ showToast('Skriv in klubbens namn först'); return; }
  setup.searching = true; setup.logoError=false; render();
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers: anthropicHeaders(),
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        messages:[{role:'user', content:
          'Hitta en direkt bild-URL (slutar på .png, .svg, .jpg eller .webp) till fotbollsklubben "'+setup.opponentName+'"s officiella klubbmärke/logotyp. '+
          'Föredra Wikipedia/Wikimedia Commons-länkar eftersom de går att länka direkt till. Svara ENDAST med kompakt JSON på formen '+
          '{"logoUrl": "https://..."} utan någon inledande text, förklaring eller markdown-formatering. Om du inte hittar någon bild, svara {"logoUrl": null}.'
        }],
        tools:[{type:'web_search_20250305', name:'web_search'}]
      })
    });
    if(!resp.ok){ throw new Error('HTTP '+resp.status); }
    const data = await resp.json();
    const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text);
    let logoUrl = null;
    for(const t of textBlocks){
      const cleaned = t.replace(/```json|```/g,'').trim();
      const match = cleaned.match(/\{[\s\S]*\}/);
      if(match){
        try{ const parsed = JSON.parse(match[0]); if(parsed.logoUrl){ logoUrl = parsed.logoUrl; break; } }catch(e){}
      }
    }
    if(logoUrl){
      setup.searching = true; render(); // keep spinner while we verify the image actually loads
      const works = await testImageLoads(logoUrl);
      if(works){
        setup.opponentLogo = logoUrl; setup.logoError=false;
        showToast('Emblem hittat');
      } else {
        showToast('Hittade en bildlänk men kunde inte ladda den — testa klistra in en annan URL manuellt');
      }
    } else {
      showToast('Hittade ingen bild — klistra in en länk manuellt');
    }
  }catch(e){
    console.error(e);
    showToast(aiUnavailableMessage());
  }
  setup.searching = false; render();
}
function testImageLoads(url){
  return new Promise(resolve=>{
    const img = new Image();
    img.referrerPolicy = 'no-referrer';
    let done = false;
    img.onload = ()=>{ if(!done){ done=true; resolve(true); } };
    img.onerror = ()=>{ if(!done){ done=true; resolve(false); } };
    img.src = url;
    setTimeout(()=>{ if(!done){ done=true; resolve(false); } }, 6000);
  });
}

function buildTimeline(match){
  const items = [
    ...match.events.map((e,i)=>({...e, _kind:'event', _seq: e.seq!==undefined ? e.seq : i})),
    ...(match.notes||[]).map((n,i)=>({...n, _kind:'note', _seq: n.seq!==undefined ? n.seq : i}))
  ];
  items.sort((a,b)=> a._seq - b._seq);
  return items;
}

  if(item._kind==='note') return renderNoteRow(item, context, match);
  return renderEventRow(item, context, match);
}
function periodTag(item, match){
  const periods = match && match.periods ? match.periods : 1;
  if(periods <= 1 || !item.period) return '';
  return `P${item.period} · `;
}
function renderNoteRow(n, context, match){
  return `<div class="event-item" onclick="openEventDetail('${n.id}','note','${context}')">
    <div class="e-time">${periodTag(n,match)}${fmtClock(n.t||0)}</div>
    <div class="e-ico2">📝</div>
    <div class="e-desc">Anteckning<span class="who">${escapeHtml(n.text)}</span></div>
    <div class="chev" style="font-size:15px;">›</div>
  </div>`;
}

/* ---------- Match report ---------- */
function timelineAsText(match){
  const multiPeriod = (match.periods||1) > 1;
  return buildTimeline(match).map(it=>{
    const pTag = multiPeriod && it.period ? 'Period '+it.period+', ' : '';
    const zTag = it.location ? ' ['+zoneLabel(it.location)+']' : '';
    if(it._kind==='note') return pTag+fmtClock(it.t||0)+' – Anteckning: '+it.text;
    const m = EVENT_META[it.type];
    if(it.type==='sub') return pTag+fmtClock(it.t||0)+' – Byte ('+teamName+'): ut #'+it.outNumber+' '+it.outName+', in #'+it.inNumber+' '+it.inName;
    if(it.type==='offside') return pTag+fmtClock(it.t||0)+' – Offside ('+(it.team==='us'?teamName:'Motstånd')+')'+zTag;
    if(it.type==='freekick' && it.auto && it.autoReason==='offside') return pTag+fmtClock(it.t||0)+' – Frispark efter offside till '+(it.team==='us'?teamName:'Motstånd')+zTag;
    if(it.team==='us') return pTag+fmtClock(it.t||0)+' – '+m.label+' ('+teamName+'): #'+it.number+' '+it.name+zTag;
    return pTag+fmtClock(it.t||0)+' – '+m.label+' (Motstånd): #'+it.number+zTag;
  }).join('\n');
}
async function generateReport(){
  if(reportGenerating || !viewMatch) return;
  const m = viewMatch;
  reportGenerating = true; render();
  try{
    const timelineText = timelineAsText(m) || '(inga registrerade händelser)';
    const prompt = 'Du är en lokaltidningsjournalist som skriver ett kort matchreferat på svenska om en fotbollsmatch på ungdoms-/breddnivå. '+
      'Skriv engagerat men sakligt, i löpande text utan punktlistor eller rubrik.\n\n'+
      'Lag: '+teamName+' mot '+m.opponentName+'\n'+
      'Datum: '+fmtDate(m.date)+'\n'+
      'Slutresultat: '+teamName+' '+m.scoreUs+' – '+m.scoreOpp+' '+m.opponentName+'\n'+
      'Matchformat: '+(m.periods||2)+' perioder á '+(m.periodMinutes||45)+' minuter\n\n'+
      'Händelselogg i kronologisk ordning (tid från matchstart), inklusive lagets egna anteckningar under matchen:\n'+timelineText+'\n\n'+
      'Skriv ett sammanhängande referat på cirka 150–250 ord. Lyft fram mål, viktiga vändpunkter (kort, avgörande byten) och väv naturligt in eventuella anteckningar som om de vore observationer från sidlinjen. '+
      'Svara ENDAST med själva referattexten – ingen rubrik, ingen inledande kommentar, ingen markdown-formatering.';
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers: anthropicHeaders(),
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        messages:[{role:'user', content:prompt}]
      })
    });
    if(!resp.ok){ throw new Error('HTTP '+resp.status); }
    const data = await resp.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    if(text){
      m.report = text;
      m.reportGeneratedAt = new Date().toISOString();
      await storeSet('match-'+m.id, m);
      showToast('🧾 Matchreferat klart');
    } else {
      showToast('Kunde inte generera referat — försök igen');
    }
  }catch(e){
    console.error(e);
    showToast(aiUnavailableMessage());
  }
  reportGenerating = false; render();
}

function zoneLabel(loc){

  return loc.x < 50 ? 'Vår planhalva' : 'Motståndarplan';

function renderEventRow(e, context, match){
  const m = EVENT_META[e.type];
  let desc, who='';
  if(e.type==='sub'){
    desc = 'Byte';
    who = `Ut: #${escapeHtml(e.outNumber)} ${escapeHtml(e.outName)} · In: #${escapeHtml(e.inNumber)} ${escapeHtml(e.inName)}`;
  } else if(e.type==='offside'){
    desc = m.label;
    who = e.team==='us' ? escapeHtml(teamName) : 'Motstånd';
  } else if(e.type==='freekick' && e.auto && e.autoReason==='offside'){
    desc = m.label + ' (efter offside)';
    who = e.team==='us' ? 'Till '+escapeHtml(teamName) : 'Till motstånd';

    desc = m.label;
    who = `#${escapeHtml(e.number)} ${escapeHtml(e.name)}`;
  } else {
    desc = m.label;
    who = `Motstånd #${escapeHtml(e.number)}`;
  }
  if(e.location) who += ` · ${zoneLabel(e.location)}`;
  return `<div class="event-item" onclick="openEventDetail('${e.id}','event','${context}')">

function renderDetail(){
  const m = viewMatch;
  const usStats = {};
  roster.forEach(p=>{ usStats[p.id] = {number:p.number, name:p.name, goal:0, assist:0, corner:0, freekick:0, penalty:0, yellow:0, red:0, sub:0}; });
  const oppStats = {};
  m.events.forEach(e=>{
    if(e.type==='sub'){
      if(usStats[e.outId]) usStats[e.outId].sub++;
      if(usStats[e.inId]) usStats[e.inId].sub++;
      return;
    }
    if(e.type==='offside') return; // not attributed to a specific player/number
    if(e.team==='us'){
      if(!e.playerId) return; // auto-generated (e.g. free kick after opponent offside), no specific player
      if(!usStats[e.playerId]) usStats[e.playerId] = {number:e.number, name:e.name, goal:0,assist:0,corner:0,freekick:0,penalty:0,yellow:0,red:0,sub:0};
      usStats[e.playerId][e.type]++;
    } else {
      if(!e.number) return; // auto-generated, no specific opponent number
      if(!oppStats[e.number]) oppStats[e.number] = {number:e.number, goal:0,corner:0,freekick:0,penalty:0,yellow:0,red:0,assist:0};
      if(oppStats[e.number][e.type]!==undefined) oppStats[e.number][e.type]++;
    }
  });
  const usRows = Object.values(usStats).filter(s=>s.goal+s.assist+s.corner+s.freekick+s.penalty+s.yellow+s.red+s.sub>0)
    .sort((a,b)=> (parseInt(a.number)||0)-(parseInt(b.number)||0))
    .map(s=>`<tr><td class="name"><div class="num-badge" style="width:26px;height:26px;font-size:11px;">${escapeHtml(s.number)}</div>${escapeHtml(s.name)}</td>
      <td>${s.goal}</td><td>${s.assist}</td><td>${s.corner}</td><td>${s.freekick}</td><td>${s.penalty}</td><td>${s.yellow}</td><td>${s.red}</td><td>${s.sub}</td></tr>`).join('');
  const oppRows = Object.values(oppStats).sort((a,b)=>(parseInt(a.number)||0)-(parseInt(b.number)||0))
    .map(s=>`<tr><td class="name"><div class="num-badge" style="width:26px;height:26px;font-size:11px;">${escapeHtml(s.number)}</div>#${escapeHtml(s.number)}</td>
      <td>${s.goal}</td><td>${s.corner}</td><td>${s.freekick}</td><td>${s.penalty}</td><td>${s.yellow}</td><td>${s.red}</td></tr>`).join('');
  const timeline = [...buildTimeline(m)].reverse();
  const eventRows = timeline.map(it=>renderTimelineRow(it,'detail',m)).join('') || `<div class="empty-hint">Inga händelser registrerade</div>`;
  const offsideUs = m.events.filter(e=>e.type==='offside' && e.team==='us').length;
  const offsideOpp = m.events.filter(e=>e.type==='offside' && e.team==='opp').length;

  return `
    <div class="topbar"><button class="back-link" onclick="goHistory()">← Historik</button>${themeToggleBtn()}</div>
    <div class="scoreboard">
      <div class="teams-row">
        <div class="team-side">
          <div class="team-badge us">${initials(teamName)}</div>
          <div class="team-name">${escapeHtml(teamName)}</div>
        </div>
        <div class="score-mid">
          <div class="score-num">${m.scoreUs}</div><div class="score-colon">:</div><div class="score-num">${m.scoreOpp}</div>
        </div>
        <div class="team-side">
          <div class="team-badge opp">${m.opponentLogo?`<img src="${escapeAttr(m.opponentLogo)}" referrerpolicy="no-referrer" onerror="this.parentElement.textContent='🛡️'">`:'🛡️'}</div>
          <div class="team-name">${escapeHtml(m.opponentName)}</div>
        </div>
      </div>
      <div style="text-align:center; color:var(--dim); font-size:12.5px; margin-top:10px;">${fmtDate(m.date)} · ${m.periods||2} x ${m.periodMinutes||45} min${(offsideUs+offsideOpp)>0 ? ' · Offside '+offsideUs+'–'+offsideOpp : ''}</div>
    </div>

    <div class="card">
      <div class="section-label">Händelsekarta</div>
      <div class="preset-row" style="margin-bottom:12px;">
        ${statFilterBtn('goal','Mål','#E8B94B')}
        ${statFilterBtn('freekick','Frispark/Straff','#57B8FF')}
        ${statFilterBtn('offside','Offside','#C77DFF')}
        ${statFilterBtn('card','Kort','#F5D442')}
      </div>
      <div class="pitch-wrap">${renderStatsPitchSvg(m, statMapFilters)}</div>
    </div>

    <div class="card">
      <div class="section-label">${escapeHtml(teamName)} — statistik</div>
      <table class="stat-table"><thead><tr><th>Spelare</th><th>⚽</th><th>🎯</th><th>🚩</th><th>🦶</th><th>⚪</th><th>🟨</th><th>🟥</th><th>🔄</th></tr></thead>
      <tbody>${usRows || '<tr><td colspan="9" style="text-align:center;color:var(--dim);padding:14px;">Inga händelser</td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <div class="section-label">Motstånd — statistik</div>
      <table class="stat-table"><thead><tr><th>Nr</th><th>⚽</th><th>🚩</th><th>🦶</th><th>⚪</th><th>🟨</th><th>🟥</th></tr></thead>
      <tbody>${oppRows || '<tr><td colspan="7" style="text-align:center;color:var(--dim);padding:14px;">Inga händelser</td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <div class="section-label">Matchreferat</div>
      ${m.report
        ? `<div class="report-text">${escapeHtml(m.report)}</div><div class="report-meta">Genererat ${m.reportGeneratedAt ? fmtDate(m.reportGeneratedAt) : ''}</div>`
        : `<div class="empty-hint">Inget referat genererat än</div>`}
      <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="generateReport()" ${reportGenerating?'disabled':''}>
        ${reportGenerating ? '⏳ Genererar referat...' : (m.report ? '🔄 Generera nytt referat' : '🧾 Generera matchreferat')}
      </button>
    </div>
    <div class="card">
      <div class="section-label">Händelselogg <span style="font-weight:400; color:var(--dim); font-size:12px;">(tryck för detaljer)</span></div>
      ${eventRows}
    </div>
    <button class="btn btn-danger btn-block" onclick="deleteMatch('${m.id}')">🗑️ Radera match</button>
  `;
}
function statFilterBtn(key,label,color){
  const active = statMapFilters[key];
  return `<button class="preset-btn" style="border-color:${active?color:'var(--line)'}; color:${active?color:'var(--dim)'};" onclick="toggleStatFilter('${key}')"><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${color}; margin-right:6px; vertical-align:middle;"></span>${label}</button>`;
}
function toggleStatFilter(key){ statMapFilters[key] = !statMapFilters[key]; render(); }
function renderStatsPitchSvg(match, filters){
  const dots = [];
  match.events.forEach(e=>{
    if(!e.location) return;
    let category=null, color=null;
    if(e.type==='goal'){ category='goal'; color='#E8B94B'; }
    else if(e.type==='freekick'){ category='freekick'; color='#57B8FF'; }
    else if(e.type==='penalty'){ category='freekick'; color='#2E86DE'; }
    else if(e.type==='offside'){ category='offside'; color='#C77DFF'; }
    else if(e.type==='yellow'){ category='card'; color='#F5D442'; }
    else if(e.type==='red'){ category='card'; color='#E5484D'; }
    if(!category || !filters[category]) return;
    const svgX = (e.location.x/100)*300;
    const svgY = (e.location.y/100)*200;
    dots.push(`<circle cx="${svgX.toFixed(1)}" cy="${svgY.toFixed(1)}" r="4.4" fill="${color}" stroke="#0E1512" stroke-width="1" fill-opacity="0.92"/>`);
  });
  return renderPitchSvg(false).replace('</svg>', dots.join('')+'</svg>');
}

function renderModal(){
  if(modal.kind==='confirmEndMatch'){
    return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">⏹️ Avsluta match?</div>
      <div class="modal-sub">Matchen mot ${escapeHtml(current.opponentName)} sparas till historiken.</div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">Avbryt</button>
        <button class="btn btn-danger-solid" style="flex:1;" onclick="confirmEndMatchYes()">Avsluta match</button>
      </div>
    </div></div>`;
  }
  if(modal.kind==='confirmDeleteMatch'){
    return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">🗑️ Radera match?</div>
      <div class="modal-sub">Matchen tas bort permanent och går inte att återställa.</div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">Avbryt</button>
        <button class="btn btn-danger-solid" style="flex:1;" onclick="confirmDeleteMatchYes()">Radera</button>
      </div>
    </div></div>`;
  }
  if(modal.kind==='confirmExitLive'){
    return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">Lämna matchvyn?</div>
      <div class="modal-sub">Matchen sparas som pågående och du kan fortsätta senare.</div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">Avbryt</button>
        <button class="btn btn-primary" style="flex:1;" onclick="confirmExitLiveYes()">Lämna</button>
      </div>
    </div></div>`;
  }
  if(modal.kind==='eventDetail'){
    const item = modal.item;
    const match = modal.context==='live' ? current : viewMatch;
    const isNote = modal.itemKind==='note';
    const m = isNote ? {icon:'📝', label:'Anteckning'} : EVENT_META[item.type];
    let who = '';
    if(isNote) who = escapeHtml(item.text);
    else if(item.type==='sub') who = `Ut: #${escapeHtml(item.outNumber)} ${escapeHtml(item.outName)} · In: #${escapeHtml(item.inNumber)} ${escapeHtml(item.inName)}`;
    else if(item.type==='offside') who = item.team==='us' ? escapeHtml(teamName) : 'Motstånd';
    else if(item.type==='freekick' && item.auto && item.autoReason==='offside') who = item.team==='us' ? 'Till '+escapeHtml(teamName) : 'Till motstånd';
    else if(item.team==='us') who = `#${escapeHtml(item.number)} ${escapeHtml(item.name)}`;
    else who = `Motstånd #${escapeHtml(item.number)}`;
    const periodTxt = (match && match.periods>1 && item.period) ? (' · Period '+item.period) : '';
    const pitchSection = item.location ? `<div class="pitch-wrap" style="margin:14px 0;">${renderPitchSvg(false)}<div class="pitch-marker" style="left:${item.location.x}%; top:${item.location.y}%; background:${item.team==='us'?'var(--turf)':'var(--opp)'};"></div></div>` : '';

    if(!modal.editing){
      return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-title">${m.icon} ${m.label}</div>
        <div class="modal-sub">${fmtClock(item.t||0)}${periodTxt} · ${who}</div>
        ${pitchSection}
        <div style="display:flex; gap:10px; margin-top:16px;">
          <button class="btn btn-ghost" style="flex:1;" onclick="toggleEditMode()">✏️ Redigera</button>
          <button class="btn btn-danger-solid" style="flex:1;" onclick="deleteEventDetail()">🗑️ Ta bort</button>
        </div>
      </div></div>`;
    }

    // Edit mode
    let editBody = '';
    const canEditLocation = item.location || LOCATION_TYPES.includes(item.type);
    const locBtn = canEditLocation ? `<button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="openEditLocation()">📍 Ändra plats</button>` : '';
    if(isNote){
      editBody = `<textarea id="edit-note-input" rows="4">${escapeHtml(item.text)}</textarea>
        <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="saveEditedNote()">💾 Spara</button>`;
    } else if(item.type==='sub'){
      const outChips = roster.filter(p=>p.id!==modal.editInId).map(p=>`<div class="sub-pick ${modal.editOutId===p.id?'selected':''}" onclick="editPickSubOut('${p.id}')">#${escapeHtml(p.number)} ${escapeHtml(p.name)}</div>`).join('') || `<div class="empty-hint" style="padding:10px;">Ingen tillgänglig</div>`;
      const inChips = roster.filter(p=>p.id!==modal.editOutId).map(p=>`<div class="sub-pick ${modal.editInId===p.id?'selected':''}" onclick="editPickSubIn('${p.id}')">#${escapeHtml(p.number)} ${escapeHtml(p.name)}</div>`).join('') || `<div class="empty-hint" style="padding:10px;">Ingen tillgänglig</div>`;
      editBody = `<div class="sub-cols">
        <div><div class="sub-col-title">UT</div><div class="sub-list">${outChips}</div></div>
        <div><div class="sub-col-title">IN</div><div class="sub-list">${inChips}</div></div>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="saveEditedSub()">💾 Spara byte</button>`;
    } else if(item.type==='offside' || (item.type==='freekick' && item.auto)){
      editBody = `<p style="color:var(--dim); font-size:13px; margin:4px 0 4px;">Den här händelsen är kopplad till ett lag, inte en specifik spelare.</p>${locBtn}`;
    } else if(item.team==='us'){
      const chips = roster.map(p=>`<div class="num-chip ${p.id===item.playerId?'selected':''}" onclick="saveEditedPlayer('${p.id}')"><div class="n">${escapeHtml(p.number)}</div><div class="nm">${escapeHtml(p.name)}</div></div>`).join('') || `<div class="empty-hint">Inga spelare i truppen</div>`;
      editBody = `<div class="modal-sub" style="margin-top:-4px;">Tryck för att byta spelare</div><div class="num-grid">${chips}</div>${locBtn}`;
    } else {
      editBody = `<div class="keypad-display">${modal.editNum || '—'}</div>
        <div class="keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="editKeypadPress('${n}')">${n}</button>`).join('')}
          <button onclick="editKeypadPress('back')">⌫</button>
          <button onclick="editKeypadPress('0')">0</button>
          <button style="background:var(--turf);color:#08150B;" onclick="saveEditedNumber()">✓</button>
        </div>${locBtn}`;
    }
    return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">✏️ Redigera — ${m.icon} ${m.label}</div>
      ${editBody}
      <button class="btn btn-ghost btn-block" style="margin-top:14px;" onclick="cancelEditItem()">Avbryt</button>
    </div></div>`;
  }
  if(modal.kind==='editLocationPick'){
    const markerHtml = modal.loc ? `<div class="pitch-marker" style="left:${modal.loc.x}%; top:${modal.loc.y}%; background:${modal.originalItem.team==='us'?'var(--turf)':'var(--opp)'};"></div>` : '';
    return `<div class="modal-backdrop" onclick="if(event.target===this)backToEventDetailEdit()"><div class="modal-sheet">
      <button class="modal-close" onclick="backToEventDetailEdit()">✕</button>
      <div class="modal-title">📍 Ändra plats</div>
      <div class="modal-sub">Tryck på planen för att markera ny plats</div>
      <div class="pitch-wrap">${renderPitchSvg(true,'editLocationTap')}${markerHtml}</div>
      <div style="display:flex; gap:10px; margin-top:14px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="backToEventDetailEdit()">Avbryt</button>
        <button class="btn btn-primary" style="flex:1;" onclick="saveEditedLocation()" ${!modal.loc?'disabled':''}>💾 Spara plats</button>
      </div>
    </div></div>`;
  }
  if(modal.kind==='pitchPick'){
    const p = modal.pending;
    const who = p.team==='us' ? ('#'+escapeHtml(p.number)+' '+escapeHtml(p.name)) : ('Motstånd #'+escapeHtml(p.number));
    const markerColor = p.team==='us' ? 'var(--turf)' : 'var(--opp)';
    const markerHtml = modal.loc ? `<div class="pitch-marker" style="left:${modal.loc.x}%; top:${modal.loc.y}%; background:${markerColor};"></div>` : '';
    const pLabel = p.type==='freekick' ? 'Frispark/straff' : EVENT_META[p.type].label;
    return `<div class="modal-backdrop" onclick="if(event.target===this)skipPitchLocation()"><div class="modal-sheet">
      <button class="modal-close" onclick="skipPitchLocation()">✕</button>
      <div class="modal-title">${EVENT_META[p.type].icon} ${pLabel} — var på plan?</div>
      <div class="modal-sub">Tryck på planen där det hände (${who})</div>
      <div class="pitch-wrap">${renderPitchSvg(true)}${markerHtml}</div>
      <div style="display:flex; gap:10px; margin-top:14px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="skipPitchLocation()">Hoppa över</button>
        <button class="btn btn-primary" style="flex:1;" onclick="confirmPitchLocation()" ${!modal.loc?'disabled':''}>Spara plats</button>
      </div>
    </div></div>`;
  }
  if(modal.kind==='penaltyConfirm'){
    const p = modal.pending;
    const who = p.team==='us' ? ('#'+escapeHtml(p.number)+' '+escapeHtml(p.name)) : ('Motstånd #'+escapeHtml(p.number));
    return `<div class="modal-backdrop"><div class="modal-sheet">
      <div class="modal-title">⚠️ Nära straffområdeslinjen</div>
      <div class="modal-sub">Platsen ligger precis vid linjen för straffområdet. Var händelsen (${who}) en straff eller en vanlig frispark?</div>
      <div class="pitch-wrap" style="margin-top:14px;">${renderPitchSvg(false)}<div class="pitch-marker" style="left:${modal.loc.x}%; top:${modal.loc.y}%; background:${p.team==='us'?'var(--turf)':'var(--opp)'};"></div></div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="resolvePenaltyConfirm(false)">🦶 Frispark</button>
        <button class="btn btn-primary" style="flex:1;" onclick="resolvePenaltyConfirm(true)">⚪ Straff</button>
      </div>
    </div></div>`;
  }
  if(modal.kind==='assistPick'){
    const scorer = roster.find(r=>r.id===modal.scorerId);
    const candidates = roster.filter(p=>p.id!==modal.scorerId);
    const chips = candidates.map(p=>`<div class="num-chip ${modal.selected.has(p.id)?'selected':''}" onclick="toggleAssistSelect('${p.id}')"><div class="n">${escapeHtml(p.number)}</div><div class="nm">${escapeHtml(p.name)}</div></div>`).join('') || `<div class="empty-hint">Inga andra spelare i truppen</div>`;
    return `<div class="modal-backdrop" onclick="if(event.target===this)skipAssist()"><div class="modal-sheet">
      <button class="modal-close" onclick="skipAssist()">✕</button>
      <div class="modal-title">🎯 Assist${scorer ? ' på mål av #'+escapeHtml(scorer.number)+' '+escapeHtml(scorer.name) : ''}</div>
      <div class="modal-sub">Markera en eller flera spelare som gjort assist till målet</div>
      <div class="num-grid">${chips}</div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn btn-ghost" style="flex:1;" onclick="skipAssist()">Ingen assist</button>
        <button class="btn btn-primary" style="flex:1;" onclick="confirmAssist()">Spara assist${modal.selected.size ? ' ('+modal.selected.size+')' : ''}</button>
      </div>
    </div></div>`;
  }
  if(modal.kind==='period'){
    return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">Ändra aktuell period</div>
      <div class="modal-sub">Ändrar bara vilken period som visas — klockan påverkas inte</div>
      <div style="display:flex; align-items:center; justify-content:center; gap:24px; margin:22px 0;">
        <button class="clock-btn" style="width:44px; height:44px; font-size:20px;" onclick="adjustPeriodValue(-1)">−</button>
        <div style="font-size:34px; font-weight:700; font-family:'Oswald',sans-serif; min-width:40px; text-align:center;">${modal.value}</div>
        <button class="clock-btn" style="width:44px; height:44px; font-size:20px;" onclick="adjustPeriodValue(1)">+</button>
      </div>
      <button class="btn btn-primary btn-block" onclick="confirmPeriodChange()">Spara</button>
    </div></div>`;
  }
  if(modal.kind==='note'){
    return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">📝 Anteckning</div>
      <div class="modal-sub">Skriv en snabb notering — taktik, skada, prestation eller annat värt att komma ihåg</div>
      <textarea id="note-input" rows="4" placeholder="Skriv här..."></textarea>
      <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="confirmNote()">Spara anteckning</button>
    </div></div>`;
  }
  if(modal.kind==='event'){
    const evLabel = modal.type==='freekick' ? 'Frispark/straff' : EVENT_META[modal.type].label;
    if(modal.team==='us'){
      const chips = roster.map(p=>`<div class="num-chip" onclick="recordUsEvent('${p.id}')"><div class="n">${escapeHtml(p.number)}</div><div class="nm">${escapeHtml(p.name)}</div></div>`).join('') || `<div class="empty-hint">Inga spelare i truppen</div>`;
      return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-title">${EVENT_META[modal.type].icon} ${evLabel}</div>
        <div class="modal-sub">Välj vilken spelare i ${escapeHtml(teamName)}</div>
        <div class="num-grid">${chips}</div>
      </div></div>`;
    } else {
      return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-title">${EVENT_META[modal.type].icon} ${evLabel} — Motstånd</div>
        <div class="modal-sub">Ange tröjnummer</div>
        <div class="keypad-display">${modal.num || '—'}</div>
        <div class="keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="keypadPress('${n}')">${n}</button>`).join('')}
          <button onclick="keypadPress('back')">⌫</button>
          <button onclick="keypadPress('0')">0</button>
          <button style="background:var(--turf);color:#08150B;" onclick="confirmOppEvent()">✓</button>
        </div>
      </div></div>`;
    }
  }
  if(modal.kind==='sub'){
    const onPitchIds = currentOnPitch();
    const onPitch = roster.filter(p=>onPitchIds.has(p.id));
    const bench = roster.filter(p=>!onPitchIds.has(p.id));
    const outList = onPitch.map(p=>`<div class="sub-pick ${modal.outId===p.id?'selected':''}" onclick="pickSubOut('${p.id}')">#${escapeHtml(p.number)} ${escapeHtml(p.name)}</div>`).join('') || `<div class="empty-hint" style="padding:10px;">Ingen på plan</div>`;
    const inList = bench.map(p=>`<div class="sub-pick ${modal.inId===p.id?'selected':''}" onclick="pickSubIn('${p.id}')">#${escapeHtml(p.number)} ${escapeHtml(p.name)}</div>`).join('') || `<div class="empty-hint" style="padding:10px;">Ingen på bänken</div>`;
    return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">🔄 Byte</div>
      <div class="modal-sub">Välj spelare ut och in</div>
      <div class="sub-cols">
        <div><div class="sub-col-title">UT</div><div class="sub-list">${outList}</div></div>
        <div><div class="sub-col-title">IN</div><div class="sub-list">${inList}</div></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="confirmSub()">Bekräfta byte</button>
    </div></div>`;
  }
  return '';
}

/* ---------- Utils ---------- */
function escapeHtml(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function themeToggleBtn(){
  return `<button class="theme-btn" onclick="toggleTheme()" title="Byt tema">${theme==='dark' ? '☀️' : '🌙'}</button>`;
}
function initials(name){
  return (name||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '?';
}

init();
</script>
</body>
