<style>
  :root{
    --bg:#0E1512;
    --bg-grad-top:#16241A;
    --bg-elev:#161F1A;
    --bg-elev-2:#1D2820;
    --line:#2A3A31;
    --turf:#3FA34D;
    --turf-deep:#2C7A3A;
    --turf-glow: rgba(63,163,77,0.25);
    --chalk:#F4F6F2;
    --dim:#93A79A;
    --gold:#E8B94B;
    --red:#D8544A;
    --opp:#7C8BA8;
    --opp-deep:#5A6785;
    --toast-bg:#F4F6F2;
    --toast-text:#0E1512;
    --spinner-track: rgba(244,246,242,0.25);
    --radius-card:20px;
    --radius-btn:12px;
    --radius-chip:999px;
  }
  :root[data-theme="light"]{
    --bg:#F3F6F0;
    --bg-grad-top:#FFFFFF;
    --bg-elev:#FFFFFF;
    --bg-elev-2:#EEF3EA;
    --line:#DBE4D7;
    --turf:#2C9A44;
    --turf-deep:#1F7A34;
    --turf-glow: rgba(44,154,68,0.16);
    --chalk:#152018;
    --dim:#5C6C61;
    --gold:#B8790E;
    --red:#C0392B;
    --opp:#46536B;
    --opp-deep:#333E52;
    --toast-bg:#152018;
    --toast-text:#F4F6F2;
    --spinner-track: rgba(21,32,24,0.15);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse 120% 80% at 50% -10%, var(--bg-grad-top) 0%, var(--bg) 55%);
    color:var(--chalk);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    transition: background .2s ease, color .2s ease;
  }
  .theme-btn{background:var(--bg-elev-2); border:1px solid var(--line); color:var(--chalk); width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; flex-shrink:0;}
  .theme-btn:active{transform:scale(0.92);}
  .topbar-right{display:flex; align-items:center; gap:8px;}
  .score-num, .clock, .app-title{font-family:'Oswald',system-ui,sans-serif;}
  #app{max-width:900px;margin:0 auto;padding:16px 16px 40px;}
  button{font-family:inherit;}
  .btn{
    appearance:none; border:none; cursor:pointer;
    background:var(--bg-elev-2); color:var(--chalk);
    border:1px solid var(--line);
    border-radius:var(--radius-btn);
    padding:14px 16px;
    font-size:15px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .08s ease, background .15s ease;
    min-height:48px;
  }
  .btn:active{transform:scale(0.96);}
  .btn:disabled{opacity:0.45; cursor:not-allowed; transform:none;}
  .btn-primary{background:linear-gradient(180deg, var(--turf) 0%, var(--turf-deep) 100%); border-color:transparent; color:#08150B; font-weight:700;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--dim);}
  .btn-danger{background:transparent; border:1px solid var(--red); color:var(--red);}

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ---------- Storage helpers ----------
   window.storage only exists when this app runs as a Claude.ai artifact.
   When opened as a standalone file or hosted elsewhere, fall back to localStorage
   so rosters and matches still persist. */
function hasClaudeStorage(){ return typeof window.storage !== 'undefined' && window.storage !== null; }
async function storeGet(key, fallback){
  if(hasClaudeStorage()){
    try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : fallback; }
    catch(e){ return fallback; }
  }
  try{ const raw = localStorage.getItem('matchstat_'+key); return raw!==null ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
async function storeSet(key, value){
  if(hasClaudeStorage()){
    try{ const result = await window.storage.set(key, JSON.stringify(value), false); if(!result) console.error('storage set failed'); }
    catch(e){ console.error('storage set failed', e); }
    return;
  }
  try{ localStorage.setItem('matchstat_'+key, JSON.stringify(value)); }
  catch(e){ console.error('localStorage set failed', e); }
}
async function storeDelete(key){
  if(hasClaudeStorage()){
    try{ await window.storage.delete(key, false); }catch(e){}
    return;
  }
  try{ localStorage.removeItem('matchstat_'+key); }catch(e){}
}

/* ---------- App State ---------- */
let roster = [];        // [{id, number, name}]
let teamName = 'Mitt lag';
let matchIndex = [];    // [{id,date,opponentName,opponentLogo,scoreUs,scoreOpp,finished}]
let current = null;     // full live/open match object
let screen = 'home';
let setup = { opponentName:'', opponentLogo:'', lineup:new Set(), searching:false, logoError:false };
let modal = null;
/* Timer is timestamp-based, not tick-counted: mobile browsers throttle or fully
   suspend setInterval when the screen locks or the tab is backgrounded, so a
   naive "elapsed++ every second" counter falls behind or stops outright.
   Instead we store when the clock was (re)started and always compute elapsed
   from the real wall-clock difference — correct immediately even after the
   screen has been off for minutes, no matter how long the interval was paused. */
let timer = { baseElapsed:0, running:false, startedAt:null, intervalId:null };
function timerElapsed(){
  if(timer.running && timer.startedAt){
    return timer.baseElapsed + Math.floor((Date.now()-timer.startedAt)/1000);
  }
  return timer.baseElapsed;
}
function resetTimer(){ timer = { baseElapsed:0, running:false, startedAt:null, intervalId:null }; }
function pauseTimer(){
  if(timer.running){ timer.baseElapsed = timerElapsed(); }
  timer.running = false; timer.startedAt = null;
  if(timer.intervalId){ clearInterval(timer.intervalId); timer.intervalId = null; }
}
let viewMatch = null; // for history detail
let theme = 'dark';
let editingPlayerId = null;
let reportGenerating = false;
let statMapFilters = { goal:true, shot:true, freekick:true, offside:true, card:true };
let apiKey = '';

const EVENT_META = {
  goal:{icon:'⚽', label:'Mål'},
  assist:{icon:'🎯', label:'Assist'},
  corner:{icon:'🚩', label:'Hörna'},
  freekick:{icon:'🦶', label:'Frispark'},
  penalty:{icon:'⚪', label:'Straff'},
  yellow:{icon:'🟨', label:'Gult kort'},
  red:{icon:'🟥', label:'Rött kort'},
  offside:{icon:'🚫', label:'Offside'},
  shot:{icon:'🥅', label:'Skott'},
  sub:{icon:'🔄', label:'Byte'}
};
const SHOT_OUTCOMES = {
  off:{icon:'↗️', label:'Utanför'},
  save:{icon:'🧤', label:'Räddning'},
  post:{icon:'📐', label:'Målram'}
};
const LOCATION_TYPES = ['goal','freekick','yellow','red','offside','shot'];
/* Penalty box zones in the 0-100% coordinate system used for locations (SVG viewBox is 0 0 300 200) */
const LEFT_BOX = { xMin:8/300*100, xMax:50/300*100, yMin:52/200*100, yMax:148/200*100 };
const RIGHT_BOX = { xMin:250/300*100, xMax:292/300*100, yMin:52/200*100, yMax:148/200*100 };
const PENALTY_MARGIN = 4; // % distance from the box line counted as "too close to call"
function inBoxStatus(loc, box, margin){
  const insideX = loc.x>=box.xMin && loc.x<=box.xMax;
  const insideY = loc.y>=box.yMin && loc.y<=box.yMax;
  if(insideX && insideY){
    const distToEdge = Math.min(loc.x-box.xMin, box.xMax-loc.x, loc.y-box.yMin, box.yMax-loc.y);
    return distToEdge<=margin ? 'near' : 'inside';
  }
  const dx = loc.x<box.xMin ? box.xMin-loc.x : (loc.x>box.xMax ? loc.x-box.xMax : 0);
  const dy = loc.y<box.yMin ? box.yMin-loc.y : (loc.y>box.yMax ? loc.y-box.yMax : 0);
  const dist = Math.sqrt(dx*dx+dy*dy);
  return dist<=margin ? 'near' : 'outside';
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtClock(sec){ const m = Math.floor(sec/60).toString().padStart(2,'0'); const s = (sec%60).toString().padStart(2,'0'); return m+':'+s; }
function fmtDate(iso){ const d = new Date(iso); return d.toLocaleDateString('sv-SE', {day:'numeric', month:'short', year:'numeric'}); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ---------- Init ---------- */
async function init(){
  roster = await storeGet('roster', []);
  teamName = await storeGet('team-name', 'Mitt lag');
  matchIndex = await storeGet('match-index', []);
  theme = await storeGet('theme', 'dark');
  apiKey = await storeGet('anthropic-api-key', '');
  document.documentElement.setAttribute('data-theme', theme);
  render();
}
async function updateApiKey(val){
  apiKey = val.trim();
  await storeSet('anthropic-api-key', apiKey);
}

async function toggleTheme(){
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  await storeSet('theme', theme);
  render();
}

/* ---------- Navigation ---------- */
function goHome(){ screen='home'; modal=null; render(); }
function goRoster(){ screen='roster'; render(); }
function goHistory(){ screen='history'; render(); }
function goSetup(){
  setup = { opponentName:'', opponentLogo:'', lineup:new Set(roster.map(p=>p.id)), searching:false, logoError:false, periods:2, periodMinutes:45 };
  screen='setup'; render();
}
function setPreset(periods, minutes){
  setup.periods = periods; setup.periodMinutes = minutes;
  render();
}

/* ---------- Roster management ---------- */
async function addPlayer(){
  const numEl = document.getElementById('new-num');
  const nameEl = document.getElementById('new-name');
  const num = numEl.value.trim();
  const name = nameEl.value.trim();
  if(!num || !name){ showToast('Fyll i nummer och namn'); return; }
  roster.push({id:uid(), number:num, name});
  roster.sort((a,b)=> (parseInt(a.number)||0) - (parseInt(b.number)||0));
  await storeSet('roster', roster);
  numEl.value=''; nameEl.value='';
  render();
}
async function removePlayer(id){
  roster = roster.filter(p=>p.id!==id);
  await storeSet('roster', roster);
  render();
}
function startEditPlayer(id){ editingPlayerId = id; render(); }
function cancelEditPlayer(){ editingPlayerId = null; render(); }
async function saveEditPlayer(id){
  const numEl = document.getElementById('edit-num-'+id);
  const nameEl = document.getElementById('edit-name-'+id);
  const num = numEl.value.trim();
  const name = nameEl.value.trim();
  if(!num || !name){ showToast('Fyll i nummer och namn'); return; }
  const p = roster.find(r=>r.id===id);
  p.number = num; p.name = name;
  roster.sort((a,b)=> (parseInt(a.number)||0) - (parseInt(b.number)||0));
  await storeSet('roster', roster);
  editingPlayerId = null;
  render();
}
async function updateTeamName(val){
  teamName = val || 'Mitt lag';
  await storeSet('team-name', teamName);
}

/* ---------- Anthropic API helper ----------
   Inside Claude.ai's artifact environment, requests to api.anthropic.com are
   authenticated automatically. Standalone (downloaded file, GitHub Pages, etc.)
   there is no built-in auth, so we use the user's own key from settings if set. */
function anthropicHeaders(){
  const headers = {'Content-Type':'application/json'};
  if(apiKey){
    headers['x-api-key'] = apiKey;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  return headers;
}
function aiUnavailableMessage(){
  return hasClaudeStorage()
    ? 'Kunde inte nå Claude just nu — försök igen.'
    : 'Kunde inte nå Claude. Appen körs fristående — lägg in en Anthropic API-nyckel under Spelartrupp för att aktivera den här funktionen.';
}

/* ---------- Setup / logo search ---------- */
function toggleLineup(id){
  if(setup.lineup.has(id)) setup.lineup.delete(id); else setup.lineup.add(id);
  render();
}
function toggleAllLineup(all){
  setup.lineup = all ? new Set(roster.map(p=>p.id)) : new Set();
  render();
}
async function searchLogo(){
  const nameEl = document.getElementById('opp-name');
  setup.opponentName = nameEl.value.trim();
  if(!setup.opponentName){ showToast('Skriv in klubbens namn först'); return; }
  setup.searching = true; setup.logoError=false; render();
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',

function testImageLoads(url){
  return new Promise(resolve=>{
    const img = new Image();
    img.referrerPolicy = 'no-referrer';
    let done = false;
    img.onload = ()=>{ if(!done){ done=true; resolve(true); } };
    img.onerror = ()=>{ if(!done){ done=true; resolve(false); } };
    img.src = url;
    setTimeout(()=>{ if(!done){ done=true; resolve(false); } }, 6000);
  });
}

function pitchTap(evt){
  const svg = evt.currentTarget;
  if(!svg) return;
  const rect = svg.getBoundingClientRect();
  const xPct = Math.max(0, Math.min(100, ((evt.clientX-rect.left)/rect.width)*100));
  const yPct = Math.max(0, Math.min(100, ((evt.clientY-rect.top)/rect.height)*100));
  modal.loc = { x: Math.round(xPct*10)/10, y: Math.round(yPct*10)/10 };
  render();
}
async function confirmPitchLocation(){
  if(!modal.loc){ showToast('Tryck på planen för att markera en plats'); return; }
  const pending = modal.pending;
  if(pending.type==='freekick'){
    const box = pending.team==='us' ? RIGHT_BOX : LEFT_BOX;
    const status = inBoxStatus(modal.loc, box, PENALTY_MARGIN);
    if(status==='inside'){
      pending.type = 'penalty';
    } else if(status==='near'){
      modal = { kind:'penaltyConfirm', pending, loc:modal.loc };
      render();
      return;
    }
  }
  if(pending.type==='shot'){
    modal = { kind:'shotOutcomePick', pending, loc:modal.loc };
    render();
    return;
  }
  if(pending.team==='us') await finalizeUsEvent(pending, modal.loc);
  else await finalizeOppEvent(pending, modal.loc);
}

  const pending = modal.pending;

  else await finalizeOppEvent(pending, loc);

}

  ev.inId=pIn.id; ev.inNumber=pIn.number; ev.inName=pIn.name;

/* ---------- Combined timeline (events + notes) ---------- */
function buildTimeline(match){
  const items = [
    ...match.events.map((e,i)=>({...e, _kind:'event', _seq: e.seq!==undefined ? e.seq : i})),
    ...(match.notes||[]).map((n,i)=>({...n, _kind:'note', _seq: n.seq!==undefined ? n.seq : i}))
  ];
  items.sort((a,b)=> a._seq - b._seq);
  return items;
}
function renderTimelineRow(item, context, match){
  if(item._kind==='note') return renderNoteRow(item, context, match);
  return renderEventRow(item, context, match);
}
function periodTag(item, match){
  const periods = match && match.periods ? match.periods : 1;
  if(periods <= 1 || !item.period) return '';
  return `P${item.period} · `;
}
function renderNoteRow(n, context, match){
  return `<div class="event-item" onclick="openEventDetail('${n.id}','note','${context}')">
    <div class="e-time">${periodTag(n,match)}${fmtClock(n.t||0)}</div>
    <div class="e-ico2">📝</div>
    <div class="e-desc">Anteckning<span class="who">${escapeHtml(n.text)}</span></div>
    <div class="chev" style="font-size:15px;">›</div>
  </div>`;
}

/* ---------- Match report ---------- */
function timelineAsText(match){
  const multiPeriod = (match.periods||1) > 1;
  return buildTimeline(match).map(it=>{
    const pTag = multiPeriod && it.period ? 'Period '+it.period+', ' : '';
    const zTag = it.location ? ' ['+zoneLabel(it.location)+']' : '';
    if(it._kind==='note') return pTag+fmtClock(it.t||0)+' – Anteckning: '+it.text;
    const m = EVENT_META[it.type];
    if(it.type==='sub') return pTag+fmtClock(it.t||0)+' – Byte ('+teamName+'): ut #'+it.outNumber+' '+it.outName+', in #'+it.inNumber+' '+it.inName;
    if(it.type==='offside') return pTag+fmtClock(it.t||0)+' – Offside ('+(it.team==='us'?teamName:'Motstånd')+')'+zTag;
    if(it.type==='freekick' && it.auto && it.autoReason==='offside') return pTag+fmtClock(it.t||0)+' – Frispark efter offside till '+(it.team==='us'?teamName:'Motstånd')+zTag;
    if(it.type==='shot'){
      const oc = SHOT_OUTCOMES[it.outcome] || {label:'Skott'};
      const shotWho = it.team==='us' ? ('#'+it.number+' '+it.name) : ('Motstånd #'+it.number);
      return pTag+fmtClock(it.t||0)+' – Skott, '+oc.label+' ('+(it.team==='us'?teamName:'Motstånd')+'): '+shotWho+zTag;
    }
    if(it.team==='us') return pTag+fmtClock(it.t||0)+' – '+m.label+' ('+teamName+'): #'+it.number+' '+it.name+zTag;
    return pTag+fmtClock(it.t||0)+' – '+m.label+' (Motstånd): #'+it.number+zTag;
  }).join('\n');
}
async function generateReport(){
  if(reportGenerating || !viewMatch) return;
  const m = viewMatch;
  reportGenerating = true; render();
  try{
    const timelineText = timelineAsText(m) || '(inga registrerade händelser)';
    const prompt = 'Du är en lokaltidningsjournalist som skriver ett kort matchreferat på svenska om en fotbollsmatch på ungdoms-/breddnivå. '+
      'Skriv engagerat men sakligt, i löpande text utan punktlistor eller rubrik.\n\n'+
      'Lag: '+teamName+' mot '+m.opponentName+'\n'+
      'Datum: '+fmtDate(m.date)+'\n'+
      'Slutresultat: '+teamName+' '+m.scoreUs+' – '+m.scoreOpp+' '+m.opponentName+'\n'+
      'Matchformat: '+(m.periods||2)+' perioder á '+(m.periodMinutes||45)+' minuter\n\n'+
      'Händelselogg i kronologisk ordning (tid från matchstart), inklusive lagets egna anteckningar under matchen:\n'+timelineText+'\n\n'+
      'Skriv ett sammanhängande referat på cirka 150–250 ord. Lyft fram mål, viktiga vändpunkter (kort, avgörande byten) och väv naturligt in eventuella anteckningar som om de vore observationer från sidlinjen. '+
      'Svara ENDAST med själva referattexten – ingen rubrik, ingen inledande kommentar, ingen markdown-formatering.';
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers: anthropicHeaders(),
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        messages:[{role:'user', content:prompt}]
      })
    });
    if(!resp.ok){ throw new Error('HTTP '+resp.status); }
    const data = await resp.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    if(text){
      m.report = text;
      m.reportGeneratedAt = new Date().toISOString();
      await storeSet('match-'+m.id, m);
      showToast('🧾 Matchreferat klart');
    } else {
      showToast('Kunde inte generera referat — försök igen');
    }
  }catch(e){
    console.error(e);
    showToast(aiUnavailableMessage());
  }
  reportGenerating = false; render();
}

function zoneLabel(loc){

function renderEventRow(e, context, match){

    desc = m.label;
    who = `#${escapeHtml(e.number)} ${escapeHtml(e.name)}`;
  } else {
    desc = m.label;
    who = `Motstånd #${escapeHtml(e.number)}`;

  const rowIcon = e.type==='shot' ? (SHOT_OUTCOMES[e.outcome]?.icon || m.icon) : m.icon;
  return `<div class="event-item" onclick="openEventDetail('${e.id}','event','${context}')">

function renderDetail(){
  const m = viewMatch;
  const usStats = {};
  roster.forEach(p=>{ usStats[p.id] = {number:p.number, name:p.name, goal:0, shot:0, assist:0, corner:0, freekick:0, penalty:0, yellow:0, red:0, sub:0}; });
  const oppStats = {};
  m.events.forEach(e=>{
    if(e.type==='sub'){
      if(usStats[e.outId]) usStats[e.outId].sub++;
      if(usStats[e.inId]) usStats[e.inId].sub++;
      return;
    }
    if(e.type==='offside') return; // not attributed to a specific player/number
    if(e.team==='us'){
      if(!e.playerId) return; // auto-generated (e.g. free kick after opponent offside), no specific player
      if(!usStats[e.playerId]) usStats[e.playerId] = {number:e.number, name:e.name, goal:0,shot:0,assist:0,corner:0,freekick:0,penalty:0,yellow:0,red:0,sub:0};
      usStats[e.playerId][e.type]++;
    } else {
      if(!e.number) return; // auto-generated, no specific opponent number
      if(!oppStats[e.number]) oppStats[e.number] = {number:e.number, goal:0,shot:0,corner:0,freekick:0,penalty:0,yellow:0,red:0,assist:0};
      if(oppStats[e.number][e.type]!==undefined) oppStats[e.number][e.type]++;
    }
  });
  const usRows = Object.values(usStats).filter(s=>s.goal+s.shot+s.assist+s.corner+s.freekick+s.penalty+s.yellow+s.red+s.sub>0)
    .sort((a,b)=> (parseInt(a.number)||0)-(parseInt(b.number)||0))
    .map(s=>`<tr><td class="name"><div class="num-badge" style="width:26px;height:26px;font-size:11px;">${escapeHtml(s.number)}</div>${escapeHtml(s.name)}</td>
      <td>${s.goal}</td><td>${s.shot}</td><td>${s.assist}</td><td>${s.corner}</td><td>${s.freekick}</td><td>${s.penalty}</td><td>${s.yellow}</td><td>${s.red}</td><td>${s.sub}</td></tr>`).join('');
  const oppRows = Object.values(oppStats).sort((a,b)=>(parseInt(a.number)||0)-(parseInt(b.number)||0))
    .map(s=>`<tr><td class="name"><div class="num-badge" style="width:26px;height:26px;font-size:11px;">${escapeHtml(s.number)}</div>#${escapeHtml(s.number)}</td>
      <td>${s.goal}</td><td>${s.shot}</td><td>${s.corner}</td><td>${s.freekick}</td><td>${s.penalty}</td><td>${s.yellow}</td><td>${s.red}</td></tr>`).join('');
  const timeline = [...buildTimeline(m)].reverse();
  const eventRows = timeline.map(it=>renderTimelineRow(it,'detail',m)).join('') || `<div class="empty-hint">Inga händelser registrerade</div>`;
  const offsideUs = m.events.filter(e=>e.type==='offside' && e.team==='us').length;
  const offsideOpp = m.events.filter(e=>e.type==='offside' && e.team==='opp').length;

  return `
    <div class="topbar"><button class="back-link" onclick="goHistory()">← Historik</button>${themeToggleBtn()}</div>
    <div class="scoreboard">
      <div class="teams-row">
        <div class="team-side">
          <div class="team-badge us">${initials(teamName)}</div>
          <div class="team-name">${escapeHtml(teamName)}</div>
        </div>
        <div class="score-mid">
          <div class="score-num">${m.scoreUs}</div><div class="score-colon">:</div><div class="score-num">${m.scoreOpp}</div>
        </div>
        <div class="team-side">
          <div class="team-badge opp">${m.opponentLogo?`<img src="${escapeAttr(m.opponentLogo)}" referrerpolicy="no-referrer" onerror="this.parentElement.textContent='🛡️'">`:'🛡️'}</div>
          <div class="team-name">${escapeHtml(m.opponentName)}</div>
        </div>
      </div>
      <div style="text-align:center; color:var(--dim); font-size:12.5px; margin-top:10px;">${fmtDate(m.date)} · ${m.periods||2} x ${m.periodMinutes||45} min${(offsideUs+offsideOpp)>0 ? ' · Offside '+offsideUs+'–'+offsideOpp : ''}</div>
    </div>

    <div class="card">
      <div class="section-label">Händelsekarta</div>
      <div class="preset-row" style="margin-bottom:12px;">
        ${statFilterBtn('goal','Mål','#E8B94B')}
        ${statFilterBtn('shot','Skott','#3DDC97')}
        ${statFilterBtn('freekick','Frispark/Straff','#57B8FF')}
        ${statFilterBtn('offside','Offside','#C77DFF')}
        ${statFilterBtn('card','Kort','#F5D442')}
      </div>
      <div class="pitch-wrap">${renderStatsPitchSvg(m, statMapFilters)}</div>
    </div>

    <div class="card">
      <div class="section-label">${escapeHtml(teamName)} — statistik</div>
      <table class="stat-table"><thead><tr><th>Spelare</th><th>⚽</th><th>🥅</th><th>🎯</th><th>🚩</th><th>🦶</th><th>⚪</th><th>🟨</th><th>🟥</th><th>🔄</th></tr></thead>
      <tbody>${usRows || '<tr><td colspan="10" style="text-align:center;color:var(--dim);padding:14px;">Inga händelser</td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <div class="section-label">Motstånd — statistik</div>
      <table class="stat-table"><thead><tr><th>Nr</th><th>⚽</th><th>🥅</th><th>🚩</th><th>🦶</th><th>⚪</th><th>🟨</th><th>🟥</th></tr></thead>
      <tbody>${oppRows || '<tr><td colspan="8" style="text-align:center;color:var(--dim);padding:14px;">Inga händelser</td></tr>'}</tbody></table>
    </div>
    <div class="card">
      <div class="section-label">Matchreferat</div>
      ${m.report
        ? `<div class="report-text">${escapeHtml(m.report)}</div><div class="report-meta">Genererat ${m.reportGeneratedAt ? fmtDate(m.reportGeneratedAt) : ''}</div>`
        : `<div class="empty-hint">Inget referat genererat än</div>`}
      <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="generateReport()" ${reportGenerating?'disabled':''}>
        ${reportGenerating ? '⏳ Genererar referat...' : (m.report ? '🔄 Generera nytt referat' : '🧾 Generera matchreferat')}
      </button>
    </div>
    <div class="card">
      <div class="section-label">Händelselogg <span style="font-weight:400; color:var(--dim); font-size:12px;">(tryck för detaljer)</span></div>
      ${eventRows}
    </div>
    <button class="btn btn-danger btn-block" onclick="deleteMatch('${m.id}')">🗑️ Radera match</button>
  `;
}
function statFilterBtn(key,label,color){
  const active = statMapFilters[key];
  return `<button class="preset-btn" style="border-color:${active?color:'var(--line)'}; color:${active?color:'var(--dim)'};" onclick="toggleStatFilter('${key}')"><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${color}; margin-right:6px; vertical-align:middle;"></span>${label}</button>`;
}
function toggleStatFilter(key){ statMapFilters[key] = !statMapFilters[key]; render(); }
function renderStatsPitchSvg(match, filters){
  const dots = [];
  match.events.forEach(e=>{
    if(!e.location) return;
    let category=null, color=null;
    if(e.type==='goal'){ category='goal'; color='#E8B94B'; }
    else if(e.type==='shot'){ category='shot'; color=(e.outcome==='save'?'#3DDC97':e.outcome==='post'?'#2FA876':'#8FE3C4'); }
    else if(e.type==='freekick'){ category='freekick'; color='#57B8FF'; }
    else if(e.type==='penalty'){ category='freekick'; color='#2E86DE'; }
    else if(e.type==='offside'){ category='offside'; color='#C77DFF'; }
    else if(e.type==='yellow'){ category='card'; color='#F5D442'; }
    else if(e.type==='red'){ category='card'; color='#E5484D'; }
    if(!category || !filters[category]) return;
    const svgX = (e.location.x/100)*300;
    const svgY = (e.location.y/100)*200;
    dots.push(`<circle cx="${svgX.toFixed(1)}" cy="${svgY.toFixed(1)}" r="4.4" fill="${color}" stroke="#0E1512" stroke-width="1" fill-opacity="0.92"/>`);
  });
  return renderPitchSvg(false).replace('</svg>', dots.join('')+'</svg>');
}

        : current.opponentLogo
          ? `<div class="logo-preview"><img src="${escapeAttr(current.opponentLogo)}" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='🛡️'"></div>`
          : `<div class="logo-preview">🛡️</div>`;
      body = `
        <div class="field" style="margin-bottom:14px;">
          <label class="field-label">Vårt lagnamn</label>
          <input type="text" value="${escapeHtml(teamName)}" onchange="updateTeamName(this.value)">
        </div>
        <div class="field" style="margin-bottom:14px;">
          <label class="field-label">Motståndarens klubb</label>
          <input id="settings-opp-name" type="text" value="${escapeHtml(current.opponentName)}" onchange="updateMatchOpponentName(this.value)">
        </div>
        <div class="logo-row">
          ${logoBox}
          <button class="btn btn-ghost" style="flex:1;" onclick="searchLogoForMatch()" ${modal.searching?'disabled':''}>🔍 Sök emblem på nätet</button>
        </div>
        <div class="field" style="margin-top:10px; margin-bottom:16px;">
          <label class="field-label">Eller klistra in bild-URL manuellt</label>
          <input type="url" placeholder="https://..." value="${escapeAttr(current.opponentLogo||'')}" onchange="updateMatchOpponentLogo(this.value)">
        </div>
        <div class="section-label">Matchformat</div>
        <div class="preset-row">
          <button class="preset-btn ${current.periods===2&&current.periodMinutes===45?'active':''}" onclick="setMatchPreset(2,45)">2 x 45</button>
          <button class="preset-btn ${current.periods===2&&current.periodMinutes===35?'active':''}" onclick="setMatchPreset(2,35)">2 x 35</button>
          <button class="preset-btn ${current.periods===2&&current.periodMinutes===25?'active':''}" onclick="setMatchPreset(2,25)">2 x 25</button>
          <button class="preset-btn ${current.periods===4&&current.periodMinutes===15?'active':''}" onclick="setMatchPreset(4,15)">4 x 15</button>
        </div>
        <div class="row-2-even">
          <div>
            <label class="field-label">Antal perioder</label>
            <input type="number" min="1" value="${current.periods||2}" onchange="updateMatchPeriods(this.value)">
          </div>
          <div>
            <label class="field-label">Minuter per period</label>
            <input type="number" min="1" value="${current.periodMinutes||45}" onchange="updateMatchPeriodMinutes(this.value)">
          </div>
        </div>
      `;
    } else {
      const rows = roster.map(p => {
        if(editingPlayerId === p.id){
          return `
          <div class="edit-row">
            <input id="edit-num-${p.id}" type="number" value="${escapeAttr(p.number)}">
            <input id="edit-name-${p.id}" type="text" value="${escapeAttr(p.name)}">
            <button class="icon-btn" style="color:var(--turf);" onclick="saveEditPlayer('${p.id}')">✓</button>
            <button class="icon-btn danger" onclick="cancelEditPlayer()">✕</button>
          </div>`;
        }
        return `
        <div class="player-row">
          <div class="num-badge">${escapeHtml(p.number)}</div>
          <div class="pname">${escapeHtml(p.name)}</div>
          <button class="icon-btn" onclick="startEditPlayer('${p.id}')">✎</button>
          <button class="icon-btn danger" onclick="removePlayer('${p.id}')">✕</button>
        </div>`;
      }).join('') || `<div class="empty-hint">Inga spelare tillagda än</div>`;
      body = `
        <div class="section-label">Lägg till spelare</div>
        <div class="row-2" style="margin-bottom:10px;">
          <input id="new-num" type="number" placeholder="Nr">
          <input id="new-name" type="text" placeholder="Namn">
        </div>
        <button class="btn btn-primary btn-block" style="margin-bottom:16px;" onclick="addPlayer()">+ Lägg till</button>
        <div class="section-label">Spelare (${roster.length})</div>
        ${rows}
        <div class="modal-sub" style="margin-top:10px;">Ändringar här gäller hela truppen, även i kommande matcher.</div>
      `;
    }
    return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">⚙️ Inställningar</div>
      <div class="preset-row" style="margin:10px 0 16px;">
        <button class="preset-btn ${tab==='match'?'active':''}" onclick="setSettingsTab('match')">🏟️ Match</button>
        <button class="preset-btn ${tab==='roster'?'active':''}" onclick="setSettingsTab('roster')">📋 Trupp</button>
      </div>
      ${body}
    </div></div>`;
  }
  if(modal.kind==='note'){
    return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">📝 Anteckning</div>
      <div class="modal-sub">Skriv en snabb notering — taktik, skada, prestation eller annat värt att komma ihåg</div>
      <textarea id="note-input" rows="4" placeholder="Skriv här..."></textarea>
      <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="confirmNote()">Spara anteckning</button>
    </div></div>`;
  }
  if(modal.kind==='event'){
    const evLabel = modal.type==='freekick' ? 'Frispark/straff' : EVENT_META[modal.type].label;
    if(modal.team==='us'){
      const chips = roster.map(p=>`<div class="num-chip" onclick="recordUsEvent('${p.id}')"><div class="n">${escapeHtml(p.number)}</div><div class="nm">${escapeHtml(p.name)}</div></div>`).join('') || `<div class="empty-hint">Inga spelare i truppen</div>`;
      return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-title">${EVENT_META[modal.type].icon} ${evLabel}</div>
        <div class="modal-sub">Välj vilken spelare i ${escapeHtml(teamName)}</div>
        <div class="num-grid">${chips}</div>
      </div></div>`;
    } else {
      return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-title">${EVENT_META[modal.type].icon} ${evLabel} — Motstånd</div>
        <div class="modal-sub">Ange tröjnummer</div>
        <div class="keypad-display">${modal.num || '—'}</div>
        <div class="keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="keypadPress('${n}')">${n}</button>`).join('')}
          <button onclick="keypadPress('back')">⌫</button>
          <button onclick="keypadPress('0')">0</button>
          <button style="background:var(--turf);color:#08150B;" onclick="confirmOppEvent()">✓</button>
        </div>
      </div></div>`;
    }
  }
  if(modal.kind==='sub'){
    const onPitchIds = currentOnPitch();
    const onPitch = roster.filter(p=>onPitchIds.has(p.id));
    const bench = roster.filter(p=>!onPitchIds.has(p.id));
    const outList = onPitch.map(p=>`<div class="sub-pick ${modal.outId===p.id?'selected':''}" onclick="pickSubOut('${p.id}')">#${escapeHtml(p.number)} ${escapeHtml(p.name)}</div>`).join('') || `<div class="empty-hint" style="padding:10px;">Ingen på plan</div>`;
    const inList = bench.map(p=>`<div class="sub-pick ${modal.inId===p.id?'selected':''}" onclick="pickSubIn('${p.id}')">#${escapeHtml(p.number)} ${escapeHtml(p.name)}</div>`).join('') || `<div class="empty-hint" style="padding:10px;">Ingen på bänken</div>`;
    return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-sheet">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">🔄 Byte</div>
      <div class="modal-sub">Välj spelare ut och in</div>
      <div class="sub-cols">
        <div><div class="sub-col-title">UT</div><div class="sub-list">${outList}</div></div>
        <div><div class="sub-col-title">IN</div><div class="sub-list">${inList}</div></div>
      </div>
      <button class="btn btn-primary btn-block" onclick="confirmSub()">Bekräfta byte</button>
    </div></div>`;
  }
  return '';
}

/* ---------- Utils ---------- */
function escapeHtml(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function themeToggleBtn(){
  return `<button class="theme-btn" onclick="toggleTheme()" title="Byt tema">${theme==='dark' ? '☀️' : '🌙'}</button>`;
}
function initials(name){
  return (name||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '?';
}

init();
</script>
</body>
</html>
